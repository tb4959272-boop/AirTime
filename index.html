<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F1A">
<title>AirTime</title>
<style>
  :root { --bg:#0F0F1A; --card:#1C1C2E; --accent:#FF4D6D; --text:#fff; --muted:#9a9ab0; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #app { height:100%; display:flex; flex-direction:column; max-width:520px; margin:0 auto; }
  .screen { display:none; flex:1; min-height:0; flex-direction:column; }
  .screen.active { display:flex; }
  header { padding:16px; font-size:20px; font-weight:700; display:flex; align-items:center; gap:10px; }
  header .back { background:none; border:none; color:var(--text); font-size:24px; cursor:pointer; }
  header span.accent { color:var(--accent); }
  .scroll { flex:1; overflow-y:auto; padding:0 16px 16px; }
  input { width:100%; padding:14px; border-radius:12px; border:1px solid #2c2c44; background:var(--card); color:var(--text); font-size:16px; margin-bottom:12px; outline:none; }
  input:focus { border-color:var(--accent); }
  button.primary { width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button.link { background:none; border:none; color:var(--accent); font-size:14px; margin-top:14px; cursor:pointer; width:100%; }
  .auth-box { margin:auto 0; padding:24px; }
  .logo { font-size:36px; font-weight:800; text-align:center; margin-bottom:6px; }
  .logo span { color:var(--accent); }
  .tag { text-align:center; color:var(--muted); margin-bottom:28px; }
  .error { color:#ff8095; font-size:14px; min-height:20px; margin-bottom:8px; text-align:center; }
  .anime { display:flex; align-items:center; gap:14px; background:var(--card); padding:14px; border-radius:14px; margin-bottom:10px; cursor:pointer; }
  .anime:active { transform:scale(.98); }
  .emoji { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:24px; background:#2a2a44; }
  .anime .name { font-weight:600; }
  .anime .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  #messages { flex:1; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:14px; background:var(--card); align-self:flex-start; word-wrap:break-word; }
  .msg.mine { align-self:flex-end; background:var(--accent); }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .msg.mine .who { color:#ffe0e6; }
  .msg .time { font-size:10px; opacity:.6; margin-top:4px; text-align:right; }
  .composer { display:flex; gap:8px; padding:10px 12px; background:var(--bg); border-top:1px solid #22223a; }
  .composer input { margin:0; flex:1; }
  .composer button { width:auto; padding:0 20px; }
  nav { display:flex; background:var(--card); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); }
  nav button { flex:1; background:none; border:none; color:var(--muted); font-size:12px; padding:6px; cursor:pointer; }
  nav button .ic { display:block; font-size:22px; }
  nav button.on { color:var(--accent); }
  .profile-card { background:var(--card); border-radius:16px; padding:24px; text-align:center; margin-bottom:16px; }
  .avatar { width:80px; height:80px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; margin:0 auto 12px; }
  .muted { color:var(--muted); font-size:14px; }
  .setup { padding:24px; line-height:1.6; }
  .setup code { background:var(--card); padding:2px 6px; border-radius:6px; }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP WARNING (shown only if Firebase config is not filled in) -->
  <div class="screen" id="s-setup">
    <div class="setup">
      <div class="logo">Air<span>Time</span></div>
      <p>Firebase is not set up yet.</p><br>
      <p>Open <code>index.html</code>, find <code>firebaseConfig</code> near the bottom, and paste your own values from Firebase Console &rarr; Project settings &rarr; Your apps.</p>
    </div>
  </div>

  <!-- AUTH -->
  <div class="screen" id="s-auth">
    <div class="auth-box">
      <div class="logo">Air<span>Time</span></div>
      <div class="tag">Talk anime with everyone</div>
      <input id="username" placeholder="Username" autocomplete="nickname" style="display:none">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <div class="error" id="auth-error"></div>
      <button class="primary" id="auth-btn">Log in</button>
      <button class="link" id="auth-toggle">New here? Create an account</button>
    </div>
  </div>

  <!-- ANIME LIST -->
  <div class="screen" id="s-list">
    <header>Air<span class="accent">Time</span></header>
    <div class="scroll" id="anime-list"></div>
  </div>

  <!-- ROOM -->
  <div class="screen" id="s-room">
    <header><button class="back" id="back">&#8592;</button><div id="room-title"></div></header>
    <div id="messages"></div>
    <div class="composer">
      <input id="msg-input" placeholder="Say something..." autocomplete="off" maxlength="500">
      <button class="primary" id="send">Send</button>
    </div>
  </div>

  <!-- PROFILE -->
  <div class="screen" id="s-profile">
    <header>Profile</header>
    <div class="scroll">
      <div class="profile-card">
        <div class="avatar" id="avatar"></div>
        <div style="font-size:20px;font-weight:700" id="p-name"></div>
        <div class="muted" id="p-email"></div>
      </div>
      <input id="new-name" placeholder="Change username">
      <button class="primary" id="save-name">Save username</button>
      <button class="link" id="logout">Log out</button>
    </div>
  </div>

  <nav id="nav" style="display:none">
    <button id="nav-list" class="on"><span class="ic">&#127916;</span>Anime</button>
    <button id="nav-profile"><span class="ic">&#128100;</span>Profile</button>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limitToLast, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ============================================================
// STEP: PASTE YOUR FIREBASE CONFIG HERE (replace all values)
// Firebase Console -> Project settings -> Your apps -> Web app
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDDyJZV4EEyPWND7N-upPa-7u4J-RWL4nM",
  authDomain: "airtime-77317.firebaseapp.com",
  projectId: "airtime-77317",
  storageBucket: "airtime-77317.firebasestorage.app",
  messagingSenderId: "687301498021",
  appId: "1:687301498021:web:45d2cd73ee637d79aaa94c"
};

// Add or remove anime here. Each one becomes a chat room.
const ANIME = [
  { id:"one-piece",        name:"One Piece",         emoji:"🏴‍☠️", sub:"Pirates & adventure" },
  { id:"jujutsu-kaisen",   name:"Jujutsu Kaisen",    emoji:"👁️", sub:"Curses & sorcery" },
  { id:"demon-slayer",     name:"Demon Slayer",      emoji:"🗡️", sub:"Swords & demons" },
  { id:"naruto",           name:"Naruto",            emoji:"🍥", sub:"Ninja world" },
  { id:"attack-on-titan",  name:"Attack on Titan",   emoji:"🛡️", sub:"Walls & titans" },
  { id:"my-hero-academia", name:"My Hero Academia",  emoji:"💥", sub:"Heroes & quirks" },
  { id:"solo-leveling",    name:"Solo Leveling",     emoji:"⚔️", sub:"Hunters & dungeons" },
  { id:"general",          name:"General Chat",      emoji:"💬", sub:"Talk about any anime" }
];

const $ = id => document.getElementById(id);
const screens = ["s-setup","s-auth","s-list","s-room","s-profile"];
function show(id) {
  screens.forEach(s => $(s).classList.toggle("active", s === id));
  const inApp = ["s-list","s-room","s-profile"].includes(id);
  $("nav").style.display = (inApp && id !== "s-room") ? "flex" : "none";
  $("nav-list").classList.toggle("on", id === "s-list");
  $("nav-profile").classList.toggle("on", id === "s-profile");
}

if (firebaseConfig.apiKey.startsWith("PASTE")) {
  show("s-setup");
} else {
  start();
}

function start() {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let isSignup = false;
  let unsubscribeRoom = null;

  // ---------- AUTH ----------
  $("auth-toggle").onclick = () => {
    isSignup = !isSignup;
    $("username").style.display = isSignup ? "block" : "none";
    $("auth-btn").textContent = isSignup ? "Create account" : "Log in";
    $("auth-toggle").textContent = isSignup ? "Already have an account? Log in" : "New here? Create an account";
    $("auth-error").textContent = "";
  };

  $("auth-btn").onclick = async () => {
    const email = $("email").value.trim();
    const pass = $("password").value;
    const name = $("username").value.trim();
    $("auth-error").textContent = "";
    try {
      if (isSignup) {
        if (!name) { $("auth-error").textContent = "Please enter a username."; return; }
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        renderProfile(auth.currentUser);
      } else {
        await signInWithEmailAndPassword(auth, email, pass);
      }
    } catch (e) {
      $("auth-error").textContent = friendlyError(e.code);
    }
  };

  function friendlyError(code) {
    const map = {
      "auth/invalid-email": "That email looks wrong.",
      "auth/missing-password": "Please enter a password.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/email-already-in-use": "This email already has an account. Log in instead.",
      "auth/invalid-credential": "Wrong email or password.",
      "auth/user-not-found": "No account found with this email.",
      "auth/wrong-password": "Wrong email or password.",
      "auth/network-request-failed": "No internet connection."
    };
    return map[code] || "Something went wrong. Try again.";
  }

  onAuthStateChanged(auth, user => {
    if (user) {
      renderProfile(user);
      renderList();
      show("s-list");
    } else {
      if (unsubscribeRoom) unsubscribeRoom();
      show("s-auth");
    }
  });

  // ---------- ANIME LIST ----------
  function renderList() {
    const box = $("anime-list");
    box.innerHTML = "";
    ANIME.forEach(a => {
      const el = document.createElement("div");
      el.className = "anime";
      el.innerHTML = '<div class="emoji"></div><div><div class="name"></div><div class="sub"></div></div>';
      el.querySelector(".emoji").textContent = a.emoji;
      el.querySelector(".name").textContent = a.name;
      el.querySelector(".sub").textContent = a.sub;
      el.onclick = () => openRoom(a);
      box.appendChild(el);
    });
  }

  // ---------- ROOM ----------
  let currentRoom = null;
  function openRoom(a) {
    currentRoom = a;
    $("room-title").textContent = a.emoji + " " + a.name;
    $("messages").innerHTML = "";
    show("s-room");
    if (unsubscribeRoom) unsubscribeRoom();
    const q = query(collection(db, "rooms", a.id, "messages"), orderBy("createdAt"), limitToLast(100));
    unsubscribeRoom = onSnapshot(q, snap => {
      const box = $("messages");
      const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
      box.innerHTML = "";
      snap.forEach(d => box.appendChild(buildMsg(d.data())));
      if (nearBottom || snap.size <= 1) box.scrollTop = box.scrollHeight;
    }, err => {
      $("messages").innerHTML = "";
      const e = document.createElement("div");
      e.className = "muted";
      e.style.padding = "16px";
      e.textContent = "Could not load messages. Check your Firestore rules.";
      $("messages").appendChild(e);
    });
  }

  function buildMsg(m) {
    const mine = auth.currentUser && m.uid === auth.currentUser.uid;
    const el = document.createElement("div");
    el.className = "msg" + (mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = mine ? "You" : (m.name || "Anonymous");
    const text = document.createElement("div");
    text.textContent = m.text;
    const time = document.createElement("div");
    time.className = "time";
    if (m.createdAt && m.createdAt.toDate) {
      time.textContent = m.createdAt.toDate().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
    }
    el.append(who, text, time);
    return el;
  }

  async function send() {
    const input = $("msg-input");
    const text = input.value.trim();
    if (!text || !currentRoom || !auth.currentUser) return;
    input.value = "";
    try {
      await addDoc(collection(db, "rooms", currentRoom.id, "messages"), {
        text: text.slice(0, 500),
        uid: auth.currentUser.uid,
        name: auth.currentUser.displayName || "Anonymous",
        createdAt: serverTimestamp()
      });
    } catch (e) {
      input.value = text;
      alert("Message not sent. Check your internet or Firestore rules.");
    }
  }
  $("send").onclick = send;
  $("msg-input").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  $("back").onclick = () => {
    if (unsubscribeRoom) unsubscribeRoom();
    show("s-list");
  };

  // ---------- PROFILE ----------
  function renderProfile(user) {
    const name = user.displayName || "Anonymous";
    $("p-name").textContent = name;
    $("p-email").textContent = user.email || "";
    $("avatar").textContent = name.charAt(0).toUpperCase();
  }
  $("save-name").onclick = async () => {
    const n = $("new-name").value.trim();
    if (!n || !auth.currentUser) return;
    await updateProfile(auth.currentUser, { displayName: n });
    renderProfile(auth.currentUser);
    $("new-name").value = "";
  };
  $("logout").onclick = () => signOut(auth);

  // ---------- NAV ----------
  $("nav-list").onclick = () => show("s-list");
  $("nav-profile").onclick = () => { renderProfile(auth.currentUser); show("s-profile"); };
}
</script>
</body>
</html>
